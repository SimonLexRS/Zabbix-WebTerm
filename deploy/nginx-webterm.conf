# WebTerm Nginx locations (reference)
#
# Include this file in the Zabbix HTTPS server block BEFORE generic static
# asset locations (.js / .css). Do not publish proxy ports 8765/8766.
#
# Docker Compose sidecar (hostname webterm-proxy):
#   proxy_pass http://webterm-proxy:8765;  (WebSocket)
#   proxy_pass http://webterm-proxy:8766;  (Web mode)
#
# Bare metal (proxy on localhost):
#   proxy_pass http://127.0.0.1:8765;
#   proxy_pass http://127.0.0.1:8766;
#
# After changing a single-file bind mount, recreate the zabbix-web container.
# A plain nginx -s reload is not enough if the inode changed.

location ~ ^/(?:html/|jscripts/|styles/|images/|i18n/|help/|fonts/|screens/|skins/|skin/|assets/|common/|lib/|features/|cgi-bin/|monitoring/|api/|webui/|restconf/|webfig(?:/|$)|jsproxy(?:/|$)|graphs(?:/|$)|files/|localizationdir$|modern_ui_installed$|helpdir$|swarm\.cgi$|styles\.css$|login$|logincheck$|logout$) {
    expires 14d;
    try_files $uri @webterm_escaped;
}

location @webterm_escaped {
    proxy_pass http://webterm-proxy:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
}

location ^~ /webterm/web {
    proxy_pass http://webterm-proxy:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
}

location /webterm/ws {
    proxy_pass http://webterm-proxy:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
